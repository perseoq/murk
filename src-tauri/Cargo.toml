[package]
name = "murk"
version = "0.0.0"
description = "Editor de Markdown con preview en vivo"
authors = ["Murk contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/perseoq/murk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "murk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
