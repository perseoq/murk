[package]
name = "murk"
version = "0.0.0"
description = "Editor de Markdown con preview en vivo"
authors = ["Murk contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/perseoq/murk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "murk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1.8.7"
chardetng = "1.0.0"
comrak = "1.0.0"
encoding_rs = "0.8.44"
notify = "8.2.2"
regex = "1.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
